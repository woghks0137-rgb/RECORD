<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:CORD | TIMELINE-SKIP</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="css/style-guide.css">
    <link rel="stylesheet" href="./css/timeline-skip-style.css">
    <link rel="stylesheet" href="./css/common-Back.css">
    <link rel="stylesheet" href="./css/m-timelineSkip.css">

    <script src="js/header.js" defer></script>
    <script src="js/timelineSkip.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="header-inner">

            <!-- header left -->
            <div class="header-left"> <!-- pc에선 display : none -->

                <button class="m-sound1">
                    <img src="img/volume-up (1).png" alt="소리켜기">
                </button>

                <button class="m-sound2">
                    <img src="img/volume-mute (1).png" alt="소리끄기">
                </button>

                <button class="m-back">
                    <img src="./img/menu.png" alt="#">
                </button>

            </div>

            <h1 class="logo">
                <a href="#">RE:CORD</a>
            </h1>

            <nav class="header-gnb">
                <ul>
                    <li><a href="#" class="active">TIMELINE</a></li>
                    <li><a href="#">MUSIC</a></li>
                    <li><a href="#">SHOP</a></li>
                    <li><a href="#">PLACE</a></li>
                    <li><a href="#">EXPERIENCE</a></li>
                </ul>
            </nav>

            <!-- header right -->
            <div class="header-right">

                <button class="sound">
                    <img src="img/volume-up (1).png" alt="<- 소리 on" class="sound-on">
                    <img src="img/volume-mute (1).png" alt="<- 소리 off" class="sound-off">
                </button>

                <button class="header-btn skip">
                    SKIP
                    <img src="img/left-arrows.png" alt="<- 화살표">
                </button>

                <button class="header-btn back">
                    <img src="img/arrow.png" alt="-> 화살표">
                    BACK
                </button>

                <button class="header-btn m-menu">
                    <img src="img/menu.png" alt="메뉴">
                </button>

            </div>
        </div>
    </header>


    <!-- TIMELINE SKIP -->
    <main class="timeline">
        <div class="timeline-inner">

            <!-- 타이틀 -->
            <section class="timeline-title">
                <h1 class="main-title">TIMELINE</h1>

                <div class="title-line">
                    <span></span>
                </div>

                <p class="timeline-sub-text">
                    시간을 따라 떠나는 기억여행이 끝났습니다.
                </p>

                <p class="main-text timeline-description">
                    다음이야기를 선택해보세요
                </p>
            </section>


            <!-- 타임라인 카드 -->
            <section class="timeline-cards">

                <!-- MUSIC -->
                <article class="timeline-card">
                    <img class="card-img" src="./img/타임라인 텍스트 배경 최종 3 1 (1).png" alt="">

                    <div class="card-photo">
                        <img src="./img/MUSIC-skip.webp" alt="music">

                        <video muted loop playsinline preload="metadata">
                            <source src="./video/music.mp4" type="video/mp4">
                        </video>
                    </div>

                    <div class="card-content">
                        <h2>MUSIC</h2>

                        <div class="card-line">
                            <span></span>
                        </div>

                        <p>시대를 담은 음악을 들어보세요.</p>

                        <a href="#" class="card-btn">
                            <img src="./img/ArrowRight.png" alt="">
                        </a>
                    </div>
                </article>


                <!-- SHOP -->
                <article class="timeline-card">
                    <img class="card-img" src="./img/타임라인 텍스트 배경 최종 3 1 (1).png" alt="">

                    <div class="card-photo">
                        <img src="./img/SHOP-skip.webp" alt="shop">

                        <video muted loop playsinline preload="metadata">
                            <source src="./video/shop.mp4" type="video/mp4">
                        </video>
                    </div>

                    <div class="card-content">
                        <h2>SHOP</h2>

                        <div class="card-line">
                            <span></span>
                        </div>

                        <p>추억의 물건을 만나보세요.</p>

                        <a href="#" class="card-btn">
                            <img src="./img/ArrowRight.png" alt="">
                        </a>
                    </div>
                </article>


                <!-- PLACE -->
                <article class="timeline-card">
                    <img class="card-img" src="./img/타임라인 텍스트 배경 최종 3 1 (1).png" alt="">

                    <div class="card-photo">
                        <img src="./img/PLACE-skip.webp" alt="place">

                        <video muted loop playsinline preload="metadata">
                            <source src="./video/place.mp4" type="video/mp4">
                        </video>
                    </div>

                    <div class="card-content">
                        <h2>PLACE</h2>

                        <div class="card-line">
                            <span></span>
                        </div>

                        <p>그 시절의 공간을 둘러보세요.</p>

                        <a href="#" class="card-btn">
                            <img src="./img/ArrowRight.png" alt="">
                        </a>
                    </div>
                </article>


                <!-- EXPERIENCE -->
                <article class="timeline-card">
                    <img class="card-img" src="./img/타임라인 텍스트 배경 최종 3 1 (1).png" alt="">

                    <div class="card-photo">
                        <img src="./img/EXPERLENCE -skip.webp" alt="experience">

                        <video muted loop playsinline preload="metadata">
                            <source src="./video/experlence.mp4" type="video/mp4">
                        </video>
                    </div>

                    <div class="card-content">
                        <h2>EXPERIENCE</h2>

                        <div class="card-line">
                            <span></span>
                        </div>

                        <p>옛 감성을 직접 느껴보세요.</p>

                        <a href="#" class="card-btn">
                            <img src="./img/ArrowRight.png" alt="">
                        </a>
                    </div>
                </article>

            </section>
        </div>
    </main>


    <footer class="footer">
        <p class="footer-text">ⓒ2026 RE:CORD.ALL rights reserved.</p>
    </footer>

</body>

</html>
